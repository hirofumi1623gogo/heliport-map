const mplGrp=L.layerGroup();
const gridGrp=L.layerGroup();
MAPPLE.forEach(f=>{
  const st={color:'#d6402a',weight:1.6,opacity:.9,fill:true,fillOpacity:0.01,interactive:false};
  (f.poly?L.polygon(f.poly,st):L.rectangle(f.b,st)).addTo(mplGrp);
  const nw=[f.b[1][0],f.b[0][1]];
  L.marker(nw,{interactive:false,keyboard:false,icon:L.divIcon({className:'',html:'<span class="mpl-lab">'+f.no+'</span>',iconAnchor:[-3,-3]})}).addTo(mplGrp);
  if(f.g){
    const S=f.b[0][0],Wl=f.b[0][1],N=f.b[1][0],El=f.b[1][1];
    const g=f.g,nc=g.cols.length;
    const ls={color:'#d6402a',weight:0.7,opacity:0.5,interactive:false};
    for(let k=0;k<=nc;k++){const x=g.L+k*g.cw;if(x>Wl+1e-9&&x<El-1e-9)L.polyline([[S,x],[N,x]],ls).addTo(gridGrp);}
    for(let k=0;k<=g.nr;k++){const y=g.T-k*g.rh;if(y>S+1e-9&&y<N-1e-9)L.polyline([[y,Wl],[y,El]],ls).addTo(gridGrp);}
    g.cols.forEach((cl,i)=>{
      const lft=Math.max(g.L+i*g.cw,Wl),rgt=Math.min(g.L+(i+1)*g.cw,El);
      if(rgt-lft<g.cw*0.25)return;

    });
    for(let k=0;k<g.nr;k++){
      const top=Math.min(g.T-k*g.rh,N),bot=Math.max(g.T-(k+1)*g.rh,S);
      if(top-bot<g.rh*0.25)continue;

// ---- ピン留め（LINEの友だちリストと同様：ピン留めした項目は常に上位。端末ごとに保存） ----
const PIN_KEY='iwakuni_heli_pins';
let pins=[];
try{pins=JSON.parse(localStorage.getItem(PIN_KEY)||'[]');if(!Array.isArray(pins))pins=[];}catch(e){pins=[];}
function savePins(){try{localStorage.setItem(PIN_KEY,JSON.stringify(pins));}catch(e){}}
const isPinned=g=>pins.includes(g);
function togglePin(g){ if(isPinned(g))pins=pins.filter(x=>x!==g); else pins.unshift(g); savePins(); render(curF); }
let curF='';
function makeItem(s){
 const d=document.createElement('div');d.className='item'+(isPinned(s.gps)?' pinned':'');
 d.innerHTML=`<div class="txt"><b>${s.gps} ${s.name}</b><span>${s.city}　${v(s.addr)}</span></div><button class="pin" type="button" title="${isPinned(s.gps)?'ピン留めを解除':'ピン留め'}" aria-label="ピン留め">📌</button>`;
 d.querySelector('.txt').onclick=()=>{map.setView([s.lat,s.lon],16);markers[s.gps].openPopup();};
 d.querySelector('.pin').onclick=ev=>{ev.stopPropagation();togglePin(s.gps);};
 return d;
}
function render(f){ curF=f||''; list.innerHTML='';
 const hit=S.filter(s=>!curF||(s.gps+s.name+s.addr).includes(curF));
 const pinned=pins.map(g=>hit.find(s=>s.gps===g)).filter(Boolean);   // ピン留め順（新しいものが上）
 const rest=hit.filter(s=>!isPinned(s.gps));                          // 通常はGPSコード順のまま
 if(pinned.length){const h=document.createElement('div');h.className='sec';h.textContent='📌 ピン留め（'+pinned.length+'）';list.appendChild(h);pinned.forEach(s=>list.appendChild(makeItem(s)));
   const h2=document.createElement('div');h2.className='sec all';h2.textContent='すべて';list.appendChild(h2);}
 rest.forEach(s=>list.appendChild(makeItem(s)));
}
render('');document.getElementById('q').oninput=e=>render(e.target.value.trim());
